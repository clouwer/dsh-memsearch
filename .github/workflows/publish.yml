name: Publish to npm

# Publishes dsh-memsearch to the npm registry on every GitHub Release.
# Uses npm Trusted Publishing (OIDC) — no token or 2FA needed at publish time.
#
# One-time setup on npmjs.com: package dsh-memsearch → Settings → Trusted
# Publishing → "Link GitHub repository" → clouwer/dsh-memsearch → select this
# workflow ("Publish to npm").

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
